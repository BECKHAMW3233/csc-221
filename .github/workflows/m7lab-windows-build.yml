# Builds Module_7/M7Lab into a Windows .exe on a real Windows machine,
# tests the .exe, takes screenshots, and commits the results back to the
# branch (dist/M7Lab_Launcher.exe, docs/screenshots/05_*.png,
# docs/windows_build/*.txt).
name: M7Lab Windows build

on:
  push:
    paths:
      - "Module_7/M7Lab/**"
      - ".github/workflows/m7lab-windows-build.yml"
      - ".github/scripts/m7lab_windows_check.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m7lab-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Module_7/M7Lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build with build_exe.bat (venv, install, unit tests, PyInstaller)
        id: build
        shell: cmd
        run: |
          if not exist docs\windows_build mkdir docs\windows_build
          call build_exe.bat < NUL > "%RUNNER_TEMP%\build_exe_log.txt" 2>&1
          set RC=%ERRORLEVEL%
          copy /y "%RUNNER_TEMP%\build_exe_log.txt" docs\windows_build\build_exe_log.txt > NUL
          type "%RUNNER_TEMP%\build_exe_log.txt"
          exit /b %RC%

      - name: Test the .exe on Windows and take screenshots
        id: check
        shell: cmd
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
          python ..\..\.github\scripts\m7lab_windows_check.py . "%RUNNER_TEMP%\build_exe_log.txt"

      - name: Commit the .exe, screenshots and logs back to the branch
        if: always()
        shell: bash
        run: |
          mkdir -p docs/windows_build
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "build step: ${{ steps.build.outcome }}"
            echo "check step: ${{ steps.check.outcome }}"
          } > docs/windows_build/status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/windows_build
          if [ -f dist/M7Lab_Launcher.exe ]; then git add -f dist/M7Lab_Launcher.exe; fi
          git add docs/screenshots/05_*.png 2>/dev/null || true
          git commit -m "Windows build results: M7Lab_Launcher.exe, screenshots, logs [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload results (also downloadable from the Actions page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M7Lab-windows-build
          path: |
            Module_7/M7Lab/dist/M7Lab_Launcher.exe
            Module_7/M7Lab/docs/screenshots/05_*.png
            Module_7/M7Lab/docs/windows_build/
          if-no-files-found: warn
